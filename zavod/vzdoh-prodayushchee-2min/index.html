  for(const o of [...document.querySelectorAll('script')]){const n=document.createElement('script');n.textContent=o.textContent;o.replaceWith(n);}
  if(location.hash){const el=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(el)el.scrollIntoView();}}
async function derive(pw){const b=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(E.salt),iterations:E.iter,hash:'SHA-256'},b,256));}
const saved=sessionStorage.getItem('mk')||localStorage.getItem('mk');
if(saved){document.getElementById('f').style.visibility='hidden';
  show(b64(saved)).catch(()=>{localStorage.removeItem('mk');sessionStorage.removeItem('mk');document.getElementById('f').style.visibility='visible';});}
